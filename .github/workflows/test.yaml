name: test 
run-name: ${{ github.actor }} is learning GitHub Actions
on: push

### use cmd as default shell ###
defaults:
  run:
    shell: cmd

### begin jobs ###
jobs:
  ### first job "prepare-miniHIL" ###
  prepare-miniHIL:
    runs-on: [miniHIL_runner]
    steps:
      - name: Build with Gradle
        run: |
          cd C:\miniHIL\TS7x_MotorController_miniHIL\MiniHilPilot
          .\gradlew.bat build
      - name: Flash with Gradle
        run: |
          cd C:\miniHIL\TS7x_MotorController_miniHIL\MiniHilPilot
          .\gradlew.bat flash

  prepare-motorController:
    runs-on: [miniHIL_runner]
    steps:
      - name: Flash with JLink
        run: JLink.exe -CommandFile C:\test\JLinkCommandFile.jlink
      #run: JFlash.exe -openprj"C:\Program Files\SEGGER\JLink\Default.jflash" -open"C:\Users\scholet\Downloads\release-armclang-static\TS7x_MotorController_MK3.hex" -auto -min -exit 
